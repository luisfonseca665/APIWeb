<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear Cuenta - APIWeb</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-lg p-4 text-center" style="max-width: 400px; width: 100%;">
        <h3 class="mb-3 fw-bold">Crear Cuenta</h3>
        <p class="text-muted mb-4">Regístrate para gestionar el inventario de productos.</p>

        <div id="alerta" class="alert d-none py-2" role="alert"></div>

        <form id="formRegistro" class="text-start needs-validation" novalidate>
            <div class="mb-3">
                <label for="Nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="Nombre" required maxlength="150" autocomplete="name">
                <div class="invalid-feedback">Ingresa tu nombre.</div>
            </div>
            <div class="mb-3">
                <label for="Email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="Email" required maxlength="150" autocomplete="username">
                <div class="invalid-feedback">Ingresa un correo válido.</div>
            </div>
            <div class="mb-3">
                <label for="Password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="Password" required minlength="6" autocomplete="new-password">
                <div class="invalid-feedback">Mínimo 6 caracteres.</div>
            </div>
            <div class="mb-4">
                <label for="Confirmar" class="form-label">Confirmar contraseña</label>
                <input type="password" class="form-control" id="Confirmar" required autocomplete="new-password">
                <div class="invalid-feedback">Las contraseñas no coinciden.</div>
            </div>
            <button type="submit" id="btnRegistro" class="btn btn-primary w-100 rounded-pill">Registrarme</button>
        </form>

        <p class="mt-4 mb-0 small">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>

    <script>
                // @ts-nocheck
                const API_BASE_URL = "api";
                const form = document.getElementById("formRegistro");
                const alerta = document.getElementById("alerta");
                const btn = document.getElementById("btnRegistro");
                const pass = document.getElementById("Password");
                const confirmar = document.getElementById("Confirmar");

                function mostrarAlerta(msg, tipo) {
                    alerta.className = `alert alert-${tipo} py-2`;
                    alerta.textContent = msg;
                }

                // Validación de que ambas contraseñas coincidan
                confirmar.addEventListener("input", () => {
                    confirmar.setCustomValidity(confirmar.value !== pass.value ? "No coinciden" : "");
                });

                form.addEventListener("submit", async (e) => {
                    e.preventDefault();
                    confirmar.setCustomValidity(confirmar.value !== pass.value ? "No coinciden" : "");
                    form.classList.add("was-validated");
                    if (!form.checkValidity()) return;

                    btn.disabled = true;
                    btn.textContent = "Registrando...";

                    try {
                        const res = await fetch(`${API_BASE_URL}/Auth/registro`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                nombre: document.getElementById("Nombre").value,
                                email: document.getElementById("Email").value,
                                password: pass.value
                            })
                        });

                        if (res.ok) {
                            mostrarAlerta("¡Cuenta creada! Redirigiendo al inicio de sesión...", "success");
                            setTimeout(() => window.location.href = "login.html", 1500);
                            return;
                        } else if (res.status === 409) {
                            mostrarAlerta("Ya existe una cuenta con ese correo.", "warning");
                        } else {
                            mostrarAlerta("No se pudo registrar el usuario. Revisa los datos.", "danger");
                        }
                    } catch (error) {
                        console.error("Error de conexión:", error);
                        mostrarAlerta("No hay conexión con la Web API.", "danger");
                    }
                    btn.disabled = false;
                    btn.textContent = "Registrarme";
                });
    </script>
</body>
</html>
