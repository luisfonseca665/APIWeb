<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Producto - APIWeb</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        // Si no hay token o ya expiró (claim "exp" del JWT), regresamos al login
        (function () {
            const t = localStorage.getItem("authToken");
            let valido = false;
            try {
                const payload = JSON.parse(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
                valido = payload.exp * 1000 > Date.now();
            } catch { valido = false; }
            if (!valido) {
                localStorage.removeItem("authToken");
                window.location.href = "login.html";
            }
        })();
    </script>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Sistema de Productos</span>
            <div>
                <a href="productos.html" class="btn btn-outline-info btn-sm me-2">Volver al Inventario</a>
                <button class="btn btn-outline-danger btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <form class="container needs-validation" id="formEditar" novalidate>
        <h2 class="mb-4">Editar Producto <span id="displayId" class="text-primary"></span></h2>

        <input type="hidden" id="ProductId">

        <div class="mb-3">
            <label for="ProductName" class="form-label">Nombre del Producto *</label>
            <input type="text" class="form-control" id="ProductName" required maxlength="40">
            <div class="invalid-feedback">Por favor, ingresa el nombre del producto.</div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="SupplierId" class="form-label">Proveedor</label>
                <select class="form-select" id="SupplierId">
                    <option value="" selected>Selecciona un proveedor...</option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label for="CategoryId" class="form-label">Categoría</label>
                <select class="form-select" id="CategoryId">
                    <option value="" selected>Selecciona una categoría...</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="QuantityPerUnit" class="form-label">Cantidad por Unidad</label>
                <input type="text" class="form-control" id="QuantityPerUnit" placeholder="Ej. 24 botellas de 500ml">
            </div>

            <div class="col-md-6 mb-3">
                <label for="UnitPrice" class="form-label">Precio Unitario ($)</label>
                <input type="number" class="form-control" id="UnitPrice" step="0.01" min="0">
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="UnitsInStock" class="form-label">Unidades en Stock</label>
                <input type="number" class="form-control" id="UnitsInStock" min="0">
            </div>

            <div class="col-md-4 mb-3">
                <label for="UnitsOnOrder" class="form-label">Unidades en Pedido</label>
                <input type="number" class="form-control" id="UnitsOnOrder" min="0">
            </div>

            <div class="col-md-4 mb-3">
                <label for="ReorderLevel" class="form-label">Nivel de Reorden</label>
                <input type="number" class="form-control" id="ReorderLevel" min="0">
            </div>
        </div>

        <div class="mb-4 form-check text-start">
            <input type="checkbox" class="form-check-input" id="Discontinued">
            <label class="form-check-label" for="Discontinued">Producto Descontinuado</label>
        </div>

        <div class="d-flex gap-2 mb-5">
            <button type="submit" class="btn btn-primary">Actualizar Cambios</button>
            <a href="productos.html" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // @ts-nocheck
        const API_BASE_URL = "/api";
        const token = localStorage.getItem("authToken");
        const form = document.getElementById('formEditar');
        
        // Extraer el ID de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const productoId = urlParams.get('id');

        window.onload = async function () {
            if (!productoId) {
                alert("No se especificó un producto para editar.");
                window.location.href = "productos.html";
                return;
            }
            
            // Cargar primero los combos para que los valores se puedan seleccionar
            await Promise.all([cargarCategorias(), cargarProveedores()]);
            await cargarProducto(productoId);
        };

        function cerrarSesion() {
            localStorage.removeItem("authToken");
            localStorage.removeItem("authUsuario");
            window.location.href = "login.html";
        }

        async function cargarCategorias() {
            try {
                const res = await fetch(`${API_BASE_URL}/Categories`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    const data = await res.json();
                    const select = document.getElementById('CategoryId');
                    data.forEach(cat => {
                        const id = cat.categoryId ?? cat.id;
                        const name = cat.categoryName ?? cat.name;
                        select.innerHTML += `<option value="${id}">${name}</option>`;
                    });
                }
            } catch (err) { console.error("Error categorías:", err); }
        }

        async function cargarProveedores() {
            try {
                const res = await fetch(`${API_BASE_URL}/Suppliers`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    const data = await res.json();
                    const select = document.getElementById('SupplierId');
                    data.forEach(sup => {
                        const id = sup.supplierId ?? sup.id;
                        select.innerHTML += `<option value="${id}">${sup.companyName}</option>`;
                    });
                }
            } catch (err) { console.error("Error proveedores:", err); }
        }

        async function cargarProducto(id) {
            try {
                const res = await fetch(`${API_BASE_URL}/Products/${id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    const p = await res.json();
                    document.getElementById('displayId').innerText = `#${p.productId}`;
                    document.getElementById('ProductId').value = p.productId;
                    document.getElementById('ProductName').value = p.productName;
                    
                    if(p.supplierId) document.getElementById('SupplierId').value = p.supplierId;
                    if(p.categoryId) document.getElementById('CategoryId').value = p.categoryId;
                    
                    document.getElementById('QuantityPerUnit').value = p.quantityPerUnit || "";
                    document.getElementById('UnitPrice').value = p.unitPrice || 0;
                    document.getElementById('UnitsInStock').value = p.unitsInStock || 0;
                    document.getElementById('UnitsOnOrder').value = p.unitsOnOrder || 0;
                    document.getElementById('ReorderLevel').value = p.reorderLevel || 0;
                    document.getElementById('Discontinued').checked = p.discontinued;
                } else {
                    alert("Producto no encontrado.");
                    window.location.href = "productos.html";
                }
            } catch (err) {
                console.error("Error:", err);
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            form.classList.add('was-validated');
            if (!form.checkValidity()) return;

            const id = parseInt(document.getElementById('ProductId').value);
            const productoActualizado = {
                productId: id,
                productName: document.getElementById('ProductName').value,
                supplierId: document.getElementById('SupplierId').value ? parseInt(document.getElementById('SupplierId').value) : null,
                categoryId: document.getElementById('CategoryId').value ? parseInt(document.getElementById('CategoryId').value) : null,
                quantityPerUnit: document.getElementById('QuantityPerUnit').value || null,
                unitPrice: parseFloat(document.getElementById('UnitPrice').value) || 0,
                unitsInStock: parseInt(document.getElementById('UnitsInStock').value) || 0,
                unitsOnOrder: parseInt(document.getElementById('UnitsOnOrder').value) || 0,
                reorderLevel: parseInt(document.getElementById('ReorderLevel').value) || 0,
                discontinued: document.getElementById('Discontinued').checked
            };

            try {
                const res = await fetch(`${API_BASE_URL}/Products/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(productoActualizado)
                });

                if (res.ok) {
                    alert("¡Producto actualizado exitosamente!");
                    window.location.href = "productos.html";
                } else if (res.status === 401) {
                    cerrarSesion();
                } else {
                    alert("Error al actualizar en el servidor.");
                }
            } catch (error) {
                alert("Error de conexión con la Web API.");
            }
        });
    </script>
</body>
</html>
