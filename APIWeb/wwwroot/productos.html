<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventario - APIWeb</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        // Si no hay sesión activa o el token ya venció, regresamos al login
        (function () {
            const t = localStorage.getItem("authToken");
            let valido = false;
            try {
                const payload = JSON.parse(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
                valido = payload.exp * 1000 > Date.now();
            } catch { valido = false; }
            if (!valido) {
                localStorage.removeItem("authToken");
                window.location.href = "login.html";
            }
        })();
    </script>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Sistema de Productos</span>
            <div>
                <a href="index.html" class="btn btn-outline-light btn-sm me-2">Nuevo Producto</a>
                <a href="proveedores.html" class="btn btn-outline-warning btn-sm me-2">Proveedores & Catálogo</a>
                <button class="btn btn-outline-danger btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">Inventario de Productos</h2>
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Descontinuado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaProductos">
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_BASE_URL = "/api";
        const token = localStorage.getItem("authToken");

        window.onload = cargarProductos;

        function cerrarSesion() {
            localStorage.removeItem("authToken");
            localStorage.removeItem("authUsuario");
            window.location.href = "login.html";
        }

        async function cargarProductos() {
            try {
                const res = await fetch(`${API_BASE_URL}/Products`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    const productos = await res.json();
                    const tbody = document.getElementById('tablaProductos');
                    tbody.innerHTML = '';
                    
                    productos.forEach(p => {
                        const descontinuado = p.discontinued ? '<span class="badge bg-danger">Sí</span>' : '<span class="badge bg-success">No</span>';
                        tbody.innerHTML += `
                            <tr>
                                <td>${p.productId}</td>
                                <td>${p.productName}</td>
                                <td>$${p.unitPrice ? p.unitPrice.toFixed(2) : '0.00'}</td>
                                <td>${p.unitsInStock || 0}</td>
                                <td>${descontinuado}</td>
                                <td>
                                    <a href="editar_producto.html?id=${p.productId}" class="btn btn-warning btn-sm me-1">Editar</a>
                                    <button class="btn btn-danger btn-sm" onclick="eliminarProducto(${p.productId})">Eliminar</button>
                                </td>
                            </tr>
                        `;
                    });
                } else if (res.status === 401) {
                    cerrarSesion();
                }
            } catch (err) {
                console.error("Error al cargar productos:", err);
            }
        }

        async function eliminarProducto(id) {
            if (!confirm(`¿Estás seguro de eliminar permanentemente el producto #${id}?`)) return;

            try {
                const res = await fetch(`${API_BASE_URL}/Products/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    cargarProductos();
                } else if (res.status === 401) {
                    alert("Tu sesión expiró. Inicia sesión de nuevo.");
                    cerrarSesion();
                } else {
                    alert("Error al eliminar el producto. Verifica que no tenga dependencias.");
                }
            } catch (err) {
                console.error("Error al eliminar:", err);
                alert("No se pudo conectar con el servidor.");
            }
        }
    </script>
</body>
</html>
