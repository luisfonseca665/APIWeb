<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión - APIWeb</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-lg p-4 text-center" style="max-width: 400px; width: 100%;">
        <h3 class="mb-3 fw-bold">Control de Inventario</h3>
        <p class="text-muted mb-4">Inicia sesión con tu cuenta para gestionar los productos.</p>

        <div id="alerta" class="alert alert-danger d-none py-2" role="alert"></div>

        <form id="formLogin" class="text-start needs-validation" novalidate>
            <div class="mb-3">
                <label for="Email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="Email" required autocomplete="username">
                <div class="invalid-feedback">Ingresa un correo válido.</div>
            </div>
            <div class="mb-4">
                <label for="Password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="Password" required autocomplete="current-password">
                <div class="invalid-feedback">Ingresa tu contraseña.</div>
            </div>
            <button type="submit" id="btnLogin" class="btn btn-primary w-100 rounded-pill">Iniciar sesión</button>
        </form>

        <p class="mt-4 mb-0 small">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
    </div>

    <script>
                // @ts-nocheck
                const API_BASE_URL = "api";
                const form = document.getElementById("formLogin");
                const alerta = document.getElementById("alerta");
                const btn = document.getElementById("btnLogin");

                function mostrarError(msg) {
                    alerta.textContent = msg;
                    alerta.classList.remove("d-none");
                }

                form.addEventListener("submit", async (e) => {
                    e.preventDefault();
                    alerta.classList.add("d-none");
                    form.classList.add("was-validated");
                    if (!form.checkValidity()) return;

                    btn.disabled = true;
                    btn.textContent = "Validando...";

                    try {
                        // 1. Enviamos las credenciales a NUESTRA API para obtener el JWT
                        const res = await fetch(`${API_BASE_URL}/Auth/login`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                email: document.getElementById("Email").value,
                                password: document.getElementById("Password").value
                            })
                        });

                        if (res.ok) {
                            const data = await res.json();
                            // 2. Guardamos el Token JWT localmente (misma clave que usan las demás páginas)
                            localStorage.setItem("authToken", data.token);
                            localStorage.setItem("authUsuario", data.nombre);
                            // 3. Redirigimos al formulario
                            window.location.href = "index.html";
                        } else if (res.status === 401) {
                            mostrarError("Correo o contraseña incorrectos.");
                        } else {
                            mostrarError("Error al validar el usuario con el servidor.");
                        }
                    } catch (error) {
                        console.error("Error de conexión:", error);
                        mostrarError("No hay conexión con la Web API.");
                    } finally {
                        btn.disabled = false;
                        btn.textContent = "Iniciar sesión";
                    }
                });
    </script>
</body>
</html>
