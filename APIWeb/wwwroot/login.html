<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión - APIWeb</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-lg p-4 text-center" style="max-width: 400px; width: 100%;">
        <h3 class="mb-3 fw-bold">Control de Inventario</h3>
        <p class="text-muted mb-4">Inicia sesión con tu cuenta de Google para gestionar los productos.</p>
        <div class="d-flex justify-content-center" id="google-btn"></div>
    </div>

    <script>
                // @ts-nocheck
                // Utiliza la misma ruta base que configuraste en tu index.html
                const API_BASE_URL = "api";

                window.onload = function () {
                    google.accounts.id.initialize({
                        client_id: "184597401086-5c0amm2gmnid263jr8t2fjiv2ker9eer.apps.googleusercontent.com",
                        callback: handleCredentialResponse
                    });

                    google.accounts.id.renderButton(
                        document.getElementById("google-btn"),
                        { theme: "filled_blue", size: "large", text: "signin_with", shape: "pill" }
                    );
                };

                async function handleCredentialResponse(response) {
                    const token = response.credential;

                    // 1. Guardamos el Token JWT localmente
                    localStorage.setItem("authToken", token);

                    try {
                        // 2. Enviamos el token al backend para registrar/actualizar al usuario en MySQL
                        const res = await fetch(`${API_BASE_URL}/Auth/sincronizar`, {
                            method: "POST",
                            headers: {
                                "Authorization": `Bearer ${token}`
                            }
                        });

                        if (res.ok) {
                            // 3. Redirigimos al formulario solo si la API validó y guardó al usuario
                            window.location.href = "index.html";
                        } else {
                            alert("Error al validar el usuario con el servidor.");
                            localStorage.removeItem("authToken");
                        }
                    } catch (error) {
                        console.error("Error de conexión:", error);
                        alert("No hay conexión con la Web API.");
                        localStorage.removeItem("authToken");
                    }
                }
    </script>
</body>
</html>
